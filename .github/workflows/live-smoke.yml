name: Live Lichess contract smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live-smoke.yml
      - scripts/live-smoke.js

permissions:
  contents: read

concurrency:
  group: lichess-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run live-smoke
